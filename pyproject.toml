[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sv-witness-metamorphic-testing"
version = "0.1.0.dev0"
description = "Research infrastructure for semantics-guided metamorphic testing of SV-Witness validators."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Okot Darwin Clay", email = "phantomstylish@gmail.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "reuse>=5.0",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sv_witness_metamorphic_testing"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
